<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活紀錄</title>
<style>
    body {
        margin: 0;
        padding: 10px;
        background-color: #f0f0f0;
        font-family: sans-serif;
    }

    /* 改用 Flexbox 佈局，讓它更有彈性地填充空間 */
    .gallery-container {
        display: flex;
        flex-wrap: wrap; /* 自動換行 */
        gap: 15px; /* 圖片之間的間距 */
        justify-content: center; /* 居中對齊 */
        align-items: flex-start; /* 頂端對齊，避免高度被強行拉伸 */
        max-width: 1400px;
        margin: 0 auto;
    }

    .img-card {
        background: #fff;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        /* 這裡很關鍵：不強制 100%，而是根據圖片內容自動決定寬度 */
        flex: 0 1 auto; 
    }

    .img-card img {
        /* 圖片最大寬度不超過螢幕，但保持原始尺寸 */
        max-width: 100%; 
        width: auto; 
        height: auto;
        display: block;
        transition: transform 0.2s;
    }

    h1 {
        text-align: center;
        font-size: 1.2rem;
        color: #333;
        padding: 20px 0;
    }

    #status { text-align: center; color: #888; padding: 20px; }
</style>
</head>
<body>

    <h1>生活紀錄</h1>
    <div id="status">正在整理照片中...</div>
    
    <div class="masonry-container" id="gallery">
        </div>

    <script>
        const username = 'Mu-Yutang';
        const repo = 'Sweet-Gallery';
        const folder = 'images'; 

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                const response = await fetch(apiUrl, { cache: "no-cache" });
                if (!response.ok) throw new Error('無法連線');
                
                const data = await response.json();
                status.style.display = 'none';

                if (Array.isArray(data)) {
                    // 過濾圖片並倒序排列
                    const images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)).reverse();

                    images.forEach(file => {
                        const card = document.createElement('div');
                        card.className = 'img-card';

                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        
                        // 點擊看原圖
                        img.onclick = () => window.open(file.download_url, '_blank');

                        card.appendChild(img);
                        gallery.appendChild(card);
                    });
                }
            } catch (e) {
                status.innerText = "目前讀不到照片，請確認 images 資料夾內有照片喔！";
            }
        }

        loadImages();
    </script>
</body>
</html>
