<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我想给你写一封信</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: -apple-system, sans-serif;
        }

        h1 {
            text-align: center;
            color: #444;
            font-size: 1.4rem;
            margin-bottom: 25px;
        }

        #status { text-align: center; color: #888; margin-top: 50px; }

        /* CSS 原生瀑布流設定 */
        .masonry-gallery {
            column-count: 3; /* 電腦版預設 3 欄 */
            column-gap: 15px; /* 欄位之間的間距 */
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 響應式：平板變 2 欄，手機變 1 欄 */
        @media (max-width: 1024px) { .masonry-gallery { column-count: 2; } }
        @media (max-width: 600px) { .masonry-gallery { column-count: 1; } }

        /* 單張圖片的外盒 */
        .img-card {
            break-inside: avoid; /* 避免單張圖片被硬切到下一欄 */
            margin-bottom: 15px;
            display: flex;
            justify-content: center; /* 讓寬度較窄的小圖（如右鍵選單）自動置中 */
        }

        .img-card img {
            /* 【核心關鍵】大圖最多縮到 100% 寬，小圖維持真實大小不拉伸！ */
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .img-card img:hover {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>听我们碎碎念，我们岁岁年年</h1>
    <div id="status">照片排版中...</div>
    
    <div class="masonry-gallery" id="gallery">
        </div>

    <script>
        const username = 'Mu-Yutang';
        const repo = 'Sweet-Gallery';
        const folder = 'images'; 

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                const response = await fetch(apiUrl, { cache: "no-cache" });
                if (!response.ok) throw new Error(`連線錯誤: ${response.status}`);
                
                const data = await response.json();

                if (Array.isArray(data)) {
                    const images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)).reverse();

                    if (images.length === 0) {
                        status.innerText = "資料夾內目前沒有圖片。";
                        return;
                    }

                    status.style.display = 'none';

                    images.forEach(file => {
                        const card = document.createElement('div');
                        card.className = 'img-card';

                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        img.onclick = () => window.open(file.download_url, '_blank'); // 點擊看大圖
                        
                        card.appendChild(img);
                        gallery.appendChild(card);
                    });
                }
            } catch (e) {
                status.innerText = `讀取失敗：${e.message}`;
            }
        }

        loadImages();
    </script>
</body>
</html>
