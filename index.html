<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活紀錄</title>
    <style>
        body {
            margin: 0;
            padding: 15px;
            background-color: #f8f9fa;
            font-family: -apple-system, sans-serif;
        }

        h1 {
            text-align: center;
            color: #444;
            font-size: 1.3rem;
            margin-bottom: 25px;
        }

        #status { text-align: center; color: #888; margin-top: 50px; line-height: 1.6; }

        /* 瀑布流外層容器 */
        .masonry-wrapper {
            display: flex;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
            align-items: flex-start;
        }

        /* 每一條直欄的設定 */
        .masonry-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 圖片設定 */
        .masonry-column img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
            display: block;
            transition: opacity 0.3s;
        }

        .masonry-column img:active { opacity: 0.8; }

        @media (max-width: 768px) {
            .masonry-wrapper { flex-direction: column; }
        }
    </style>
</head>
<body>

    <h1>生活紀錄</h1>
    <div id="status">照片排版中...</div>
    
    <div class="masonry-wrapper" id="gallery">
        </div>

    <script>
        const username = 'Mu-Yutang';
        const repo = 'Sweet-Gallery';
        // 前輩，路徑幫你修正回 images 資料夾了！
        const folder = 'images'; 

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            
            // 自動判斷是否為根目錄，避免網址多出奇怪的斜線
            const path = folder ? `/${folder}` : '';
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents${path}`;

            try {
                const response = await fetch(apiUrl, { cache: "no-cache" });
                
                // 增加精準報錯，不再只有死板的失敗訊息
                if (!response.ok) {
                    if (response.status === 403) throw new Error('讀取太頻繁，被 GitHub 暫時限制了 (Rate Limit)，請等幾分鐘後重整');
                    if (response.status === 404) throw new Error(`找不到指定的資料夾：${folder || '根目錄'}`);
                    throw new Error(`連線錯誤代碼: ${response.status}`);
                }
                
                const data = await response.json();

                if (Array.isArray(data)) {
                    const images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)).reverse();

                    // 如果資料夾裡沒圖片，必須把字顯示出來
                    if (images.length === 0) {
                        status.innerText = "資料夾裡目前沒有找到圖片喔！";
                        status.style.display = 'block';
                        return;
                    }

                    status.style.display = 'none';

                    // 判斷當前螢幕寬度，決定要切成幾欄
                    let colCount = window.innerWidth > 1024 ? 3 : window.innerWidth > 768 ? 2 : 1;
                    let columns = [];

                    for (let i = 0; i < colCount; i++) {
                        let col = document.createElement('div');
                        col.className = 'masonry-column';
                        columns.push(col);
                        gallery.appendChild(col);
                    }

                    images.forEach((file, index) => {
                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        img.onclick = () => window.open(file.download_url, '_blank');
                        
                        columns[index % colCount].appendChild(img);
                    });
                }
            } catch (e) {
                // 如果出錯，把錯誤訊息直接印在畫面上方便前輩除錯
                status.innerText = `讀取失敗：${e.message}`;
                status.style.display = 'block';
            }
        }

        loadImages();
    </script>
</body>
</html>
