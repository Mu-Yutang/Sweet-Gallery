<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甜蜜相簿</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff; /* 給太座用的，改簡約白 */
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .container {
            max-width: 600px; /* 縮小寬度，在手機看更像相簿 */
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: block;
        }
        h1 { color: #333; font-size: 1.5rem; margin-bottom: 20px; }
        .loading { color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h1>生活紀錄</h1>
    <div id="status" class="loading">照片讀取中...</div>
    
    <div class="container" id="gallery"></div>

    <script>
        // 已根據前輩的截圖修正設定
        const username = 'Mu-Yutang';
        const repo = 'Sweet-Gallery';
        const folder = 'images'; 

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            
            // GitHub API 網址
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error('連線失敗');
                
                const data = await response.json();
                status.style.display = 'none'; // 讀取成功就隱藏文字

                if (Array.isArray(data)) {
                    // 這裡多做一個反轉，讓最新上傳的照片(檔名大或新)排在上面
                    data.reverse().forEach(file => {
                        if (file.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)) {
                            const img = document.createElement('img');
                            // 使用 raw.githubusercontent 連結，讀取更穩定
                            img.src = `https://raw.githubusercontent.com/${username}/${repo}/main/${folder}/${file.name}`;
                            img.loading = "lazy";
                            gallery.appendChild(img);
                        }
                    });
                }
            } catch (error) {
                console.error("Error:", error);
                status.innerText = "目前暫時無法載入照片，請稍後再試。";
            }
        }

        loadImages();
    </script>
</body>
</html>
