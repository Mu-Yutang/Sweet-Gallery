<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相簿</title>
    <style>
        /* 基礎樣式 */
        body {
            margin: 0;
            padding: 10px;
            background-color: #f8f9fa;
            font-family: -apple-system, system-ui, sans-serif;
        }

        h1 {
            text-align: center;
            color: #444;
            font-size: 1.2rem;
            margin: 20px 0;
        }

        /* 自動填充容器：CSS Grid */
        .gallery-grid {
            display: grid;
            /* 自動填充：每張圖最小 150px，自動平分剩餘空間 */
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            grid-gap: 8px; /* 照片間距 */
            padding: 5px;
        }

        /* 圖片容器：確保比例一致 */
        .img-item {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 正方形填充 */
            overflow: hidden;
            border-radius: 4px;
            background-color: #eee;
        }

        .img-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* 自動填充並裁切多餘部分，讓排版整齊 */
            transition: transform 0.3s ease;
        }

        /* 點擊效果 */
        .img-item img:active {
            transform: scale(0.95);
        }

        #status {
            text-align: center;
            color: #888;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <h1>生活紀錄</h1>
    <div id="status">照片載入中...</div>
    <div class="gallery-grid" id="gallery"></div>

    <script>
        // 設定區
        const username = 'Mu-Yutang';
        const repo = 'Sweet-Gallery';
        const folder = 'images'; 

        async function loadImages() {
            const gallery = document.getElementById('gallery');
            const status = document.getElementById('status');
            const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents/${folder}`;

            try {
                const response = await fetch(apiUrl, { cache: "no-cache" });
                if (!response.ok) throw new Error();
                
                const data = await response.json();
                status.style.display = 'none';

                if (Array.isArray(data)) {
                    // 過濾並倒序（最新照片在前）
                    const images = data.filter(f => f.name.match(/\.(jpg|jpeg|png|gif|webp)$/i)).reverse();

                    images.forEach(file => {
                        // 建立填充容器
                        const div = document.createElement('div');
                        div.className = 'img-item';

                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        
                        // 點擊看大圖
                        img.onclick = () => window.open(file.download_url, '_blank');

                        div.appendChild(img);
                        gallery.appendChild(div);
                    });
                }
            } catch (e) {
                status.innerText = "載入失敗，請確認 images 資料夾內有照片。";
            }
        }

        loadImages();
    </script>
</body>
</html>
